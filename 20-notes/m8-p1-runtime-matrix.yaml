# M8-P1 Runtime Matrix

## Purpose

Define the initial runtime matrix for Extism/Wasmtime and Extism/Wazero across supported host platforms and guest toolchains. This matrix is referenced by [Section 1.1 Contract And Data Model](./m8-p1-contract-and-data-model-implementation.md) and [Section 1.2 Behavior And Integration](./m8-p1-behavior-and-integration-implementation.md).

## Matrix Configuration

```yaml
matrix:
  - engine: "Extism/Wasmtime"
    version: "0.6.x"
    os:
      - name: "Linux"
        architecture: ["x86_64", "aarch64"]
        features: ["WASI", "memory", "gas"]
        status: "supported"
      - name: "macOS"
        architecture: ["x86_64", "aarch64"]
        features: ["WASI", "memory", "gas"]
        status: "supported"
      - name: "Windows"
        architecture: ["x86_64"]
        features: ["WASI", "memory", "gas"]
        status: "experimental"

  - engine: "Extism/Wazero"
    version: "1.7.x"
    os:
      - name: "Linux"
        architecture: ["x86_64", "aarch64"]
        features: ["WASI", "memory"]
        status: "supported"
      - name: "macOS"
        architecture: ["x86_64", "aarch64"]
        features: ["WASI", "memory"]
        status: "supported"
      - name: "Windows"
        architecture: ["x86_64"]
        features: ["WASI", "memory"]
        status: "experimental"
```

## Disposition Hierarchy

The following hierarchy defines the disposition levels from highest to lowest:

1. **conforming** - All tests pass, no divergences across runtimes
2. **supported** - Fully tested and meets all normative requirements
3. **experimental** - Under active development, may have known issues
4. **expected-failure** - Known failures documented with issue references
5. **quarantined** - Failing and under investigation
6. **skipped** - Skipped due to external dependencies or resource constraints
7. **excluded** - Explicitly excluded from testing
8. **divergent** - Different results across runtimes but all correct

## Maintenance

- Update this matrix when new configurations are tested.
- Update disposition statuses when test results change.
- Commit alongside evidence manifests that reference this matrix.

